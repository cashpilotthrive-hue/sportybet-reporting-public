Comprehensive Enterprise Dependabot Configuration (.github/dependabot.yml)
Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
=========================================================================
1. NPM / Node.js Dependencies
=========================================================================
￼ package-ecosystem: "npm"
directory: "/"
schedule:
interval: "weekly"
day: "monday"
time: "04:00"
timezone: "America/New_York"
open-pull-requests-limit: 10
target-branch: "main"
Assignees and reviewers
assignees:
￼ "dev-lead"
reviewers:
￼ "frontend-team"
￼ "security-team"
labels:
￼ "dependencies"
￼ "javascript"
￼ "automerge-candidate"
Automatic semantic versioning PR commit/title formatting
commit-message:
prefix: "chore(deps)"
prefix-development: "chore(deps-dev)"
include: "scope"
Ignore major breaking changes for specific core frameworks if needed
ignore:
￼ dependency-name: "react"
update-types: ["version-update:semver-major"]
￼ dependency-name: "react-dom"
update-types: ["version-update:semver-major"]
Group updates to reduce PR noise (e.g., bundle non-breaking patch/minor updates)
groups:
minor-and-patch:
patterns:
- "*"
update-types:
- "minor"
- "patch"
